name: Publish IDDEFIX to PyPI

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-artifacts:
    name: Build source and wheel artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build twine

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = {}
          exec(Path('iddefix/_version.py').read_text(), version)
          expected_tag = f"v{version['__version__']}"
          if os.environ['RELEASE_TAG'] != expected_tag:
              raise SystemExit(f"Release tag must be {expected_tag}")
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iddefix-dist
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-artifacts

    environment:
      name: pypi
      url: https://pypi.org/project/iddefix/

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: iddefix-dist
          path: dist

      - name: Show files to be uploaded
        run: ls -R dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
