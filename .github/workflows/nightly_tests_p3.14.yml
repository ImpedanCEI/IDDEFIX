name: nightly_tests_CPU_python3.14

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest
          python-version: "3.14"
      - name: Checkout iddefix
        uses: actions/checkout@v4
        with:
          path: iddefix
      - name: Install dependencies
        run: |
          cd iddefix
          pip install .
          pip install wakis pytest pytest-cov ipywidgets
      - name: Run pytest
        run: |
          cd iddefix
          python -m pytest --cov=iddefix -v tests
