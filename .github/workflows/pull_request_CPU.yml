# Run tests for every pull request
name: pull_request_CPU

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install IDDEFIX
        run: |
          pip install .
          pip install pytest pytest-cov ipywidgets

      - name: Install optional Wakis integration
        if: matrix.python-version != '3.15'
        run: pip install wakis

      - name: Check notebook extra on Python 3.15
        if: matrix.python-version == '3.15'
        run: pip install '.[notebook]'

      - name: Print installed packages
        run: conda list

      - name: Run pytest (with coverage)
        run: |
          python -m pytest --cov=iddefix --cov-report=term-missing -vv

      - name: Generate coverage summary
        if: matrix.python-version == '3.12'
        run: |
          coverage report > coverage.txt

      - name: Comment coverage on PR (update if exists)
        if: matrix.python-version == '3.12' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- iddefix-coverage-comment -->';
            const report = fs.readFileSync('coverage.txt', 'utf8');

            const body =
              `${marker}\n` +
              `## 🧪 Coverage Report\n\n` +
              `\`\`\`\n${report}\n\`\`\`\n` +
              `*Updated: ${new Date().toISOString()}*`;

            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
